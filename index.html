<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda do Salão do Reino</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f1f5f9; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgIFo9xBec84IDHdxw1jZFVVveZZpDw-s",
      authDomain: "agenda-salao-71ce7.firebaseapp.com",
      projectId: "agenda-salao-71ce7",
      storageBucket: "agenda-salao-71ce7.firebasestorage.app",
      messagingSenderId: "656234004138",
      appId: "1:656234004138:web:199c68a7b48e9d0d2adad3"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.firestoreOps = { collection, doc, setDoc, deleteDoc, onSnapshot };

    signInAnonymously(window.auth)
      .then(() => console.log("Firebase Auth: Conectado"))
      .catch((err) => console.warn("Firebase Auth:", err.message));
  </script>

  <!-- Aplicação Principal -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CONGREGACOES_DEFAULT = [
      { id: 'espanhola', nome: 'Espanhola', hex: '#2563eb' },
      { id: 'itinga', nome: 'Itinga', hex: '#059669' },
      { id: 'profipo', nome: 'Profipo', hex: '#d97706' }
    ];

    const ESPACOS_SALAO = [
      { id: 'salao_principal', label: 'Salão Principal' },
      { id: 'sala_b', label: 'Sala B' }
    ];

    const TIPOS_EVENTO = [
      { id: 'reuniao_meio_semana', label: 'Reunião Vida e Ministério' },
      { id: 'reuniao_fim_semana', label: 'Reunião Pública e Sentinela' },
      { id: 'visita_sc', label: 'Visita do Superint. de Circuito' },
      { id: 'reuniao_anciaos_servos', label: 'Reunião de Anciãos / Servos' },
      { id: 'escola_reino_curso', label: 'Escola / Curso Bíblico' },
      { id: 'limpeza_geral', label: 'Limpeza e Manutenção' },
      { id: 'casamento', label: 'Discurso de Casamento' },
      { id: 'funeral', label: 'Discurso Fúnebre' },
      { id: 'saida_campo_extra', label: 'Saída de Campo' },
      { id: 'outro', label: 'Outro Evento' }
    ];

    const DIAS_OPCOES = [
      { valor: 0, nome: "Domingo" },
      { valor: 1, nome: "Segunda-feira" },
      { valor: 2, nome: "Terça-feira" },
      { valor: 3, nome: "Quarta-feira" },
      { valor: 4, nome: "Quinta-feira" },
      { valor: 5, nome: "Sexta-feira" },
      { valor: 6, nome: "Sábado" }
    ];

    const CONFIG_RODIZIO_DEFAULT = {
      "2026": {
        espanhola: {
          meioSemana: { diaSemana: 2, diaNome: "Terça-feira", horaInicio: "19:30", horaFim: "21:15" },
          fimSemana: { diaSemana: 0, diaNome: "Domingo", horaInicio: "09:00", horaFim: "10:45" }
        },
        itinga: {
          meioSemana: { diaSemana: 3, diaNome: "Quarta-feira", horaInicio: "19:30", horaFim: "21:15" },
          fimSemana: { diaSemana: 6, diaNome: "Sábado", horaInicio: "19:00", horaFim: "20:45" }
        },
        profipo: {
          meioSemana: { diaSemana: 4, diaNome: "Quinta-feira", horaInicio: "19:30", horaFim: "21:15" },
          fimSemana: { diaSemana: 0, diaNome: "Domingo", horaInicio: "19:00", horaFim: "20:45" }
        }
      }
    };

    function normalizarEscala(dadosDoBanco) {
      if (!dadosDoBanco || typeof dadosDoBanco !== 'object') return CONFIG_RODIZIO_DEFAULT;
      const resultado = { ...CONFIG_RODIZIO_DEFAULT, ...dadosDoBanco };

      Object.keys(resultado).forEach(ano => {
        const anoObj = resultado[ano];
        if (!anoObj || typeof anoObj !== 'object') {
          resultado[ano] = CONFIG_RODIZIO_DEFAULT["2026"];
          return;
        }

        ['espanhola', 'itinga', 'profipo'].forEach(congId => {
          const padrao = CONFIG_RODIZIO_DEFAULT["2026"][congId];
          if (!anoObj[congId] || typeof anoObj[congId] !== 'object') {
            anoObj[congId] = padrao;
            return;
          }
          if (!anoObj[congId].meioSemana || typeof anoObj[congId].meioSemana !== 'object' || typeof anoObj[congId].meioSemana.diaSemana === 'undefined') {
            anoObj[congId].meioSemana = padrao.meioSemana;
          }
          if (!anoObj[congId].fimSemana || typeof anoObj[congId].fimSemana !== 'object' || typeof anoObj[congId].fimSemana.diaSemana === 'undefined') {
            anoObj[congId].fimSemana = padrao.fimSemana;
          }
        });
      });

      return resultado;
    }

    const EVENTO_INICIAL = {
      titulo: '',
      congregacaoId: 'espanhola',
      espacoId: 'salao_principal',
      tipoEvento: 'outro',
      data: new Date().toISOString().split('T')[0],
      horaInicio: '19:00',
      horaFim: '21:00',
      responsavel: '',
      telefone: '',
      observacoes: ''
    };

    function App() {
      const [reservasManuais, setReservasManuais] = useState([]);
      const [congAtiva, setCongAtiva] = useState('todas');
      const [filtroEspaco, setFiltroEspaco] = useState('todos');
      const [viewMode, setViewMode] = useState('mes');
      const [currentDate, setCurrentDate] = useState(new Date());
      const [congregacoes, setCongregacoes] = useState(CONGREGACOES_DEFAULT);
      const [rotacoes, setRotacoes] = useState(CONFIG_RODIZIO_DEFAULT);
      const [statusConexao, setStatusConexao] = useState('Conectando ao Firebase...');

      const [modalAberto, setModalAberto] = useState(false);
      const [modalConfigAberto, setModalConfigAberto] = useState(false);
      const [eventoSelecionado, setEventoSelecionado] = useState(null);
      const [eventoEmEdicao, setEventoEmEdicao] = useState(null);
      const [anoEdicao, setAnoEdicao] = useState(new Date().getFullYear());

      const [formEvento, setFormEvento] = useState(EVENTO_INICIAL);

      // Firebase Sync
      useEffect(() => {
        let unsubReservas = null;
        let unsubConfig = null;

        const checkFirebase = setInterval(() => {
          if (window.db && window.firestoreOps) {
            clearInterval(checkFirebase);
            const { collection, onSnapshot, doc } = window.firestoreOps;

            unsubReservas = onSnapshot(collection(window.db, 'reservas_salao'), (snapshot) => {
              const dados = [];
              snapshot.forEach((d) => {
                const item = d.data();
                if (item && item.data && item.titulo) {
                  dados.push({ id: d.id, ...item });
                }
              });
              setReservasManuais(dados);
              setStatusConexao('Tempo real ativo');
            }, (error) => {
              console.error(error);
              setStatusConexao('Erro de sincronização');
            });

            unsubConfig = onSnapshot(doc(window.db, 'configuracoes', 'geral'), (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.rotacoes) {
                  setRotacoes(normalizarEscala(data.rotacoes));
                }
                if (Array.isArray(data.congregacoes) && data.congregacoes.length > 0) {
                  setCongregacoes(data.congregacoes);
                }
              }
            });
          }
        }, 150);

        return () => {
          clearInterval(checkFirebase);
          if (unsubReservas) unsubReservas();
          if (unsubConfig) unsubConfig();
        };
      }, []);

      // Reuniões fixas semanais (Bloqueiam todo o Salão do Reino)
      const reunioesFixasDoAno = useMemo(() => {
        const ano = currentDate.getFullYear();
        const escalaDoAno = rotacoes[String(ano)] || rotacoes["2026"] || CONFIG_RODIZIO_DEFAULT["2026"];
        const lista = [];

        const mesAtual = currentDate.getMonth();
        const mesesParaGerar = [mesAtual - 1, mesAtual, mesAtual + 1];

        mesesParaGerar.forEach(m => {
          const dataBase = new Date(ano, m, 1);
          const anoRef = dataBase.getFullYear();
          const mesRef = dataBase.getMonth();
          const totalDias = new Date(anoRef, mesRef + 1, 0).getDate();

          for (let dia = 1; dia <= totalDias; dia++) {
            const dataObj = new Date(anoRef, mesRef, dia);
            const diaSemana = dataObj.getDay();
            const dataStr = `${anoRef}-${String(mesRef + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;

            congregacoes.forEach(cong => {
              const configCong = escalaDoAno?.[cong.id];
              if (!configCong) return;

              if (configCong.meioSemana && Number(configCong.meioSemana.diaSemana) === diaSemana) {
                lista.push({
                  id: `fixa_meio_${cong.id}_${dataStr}`,
                  titulo: `Reunião Vida e Ministério (${cong.nome})`,
                  congregacaoId: cong.id,
                  espacoId: 'salao_principal',
                  bloqueiaTodoPredio: true, // Bloqueia Salão Principal e Sala B
                  tipoEvento: 'reuniao_meio_semana',
                  data: dataStr,
                  horaInicio: configCong.meioSemana.horaInicio || "19:30",
                  horaFim: configCong.meioSemana.horaFim || "21:15",
                  responsavel: 'Corpo de Anciãos',
                  telefone: '',
                  observacoes: 'Horário semanal fixo (Uso integral do Salão do Reino)',
                  isFixa: true
                });
              }

              if (configCong.fimSemana && Number(configCong.fimSemana.diaSemana) === diaSemana) {
                lista.push({
                  id: `fixa_fim_${cong.id}_${dataStr}`,
                  titulo: `Reunião Pública e Sentinela (${cong.nome})`,
                  congregacaoId: cong.id,
                  espacoId: 'salao_principal',
                  bloqueiaTodoPredio: true, // Bloqueia Salão Principal e Sala B
                  tipoEvento: 'reuniao_fim_semana',
                  data: dataStr,
                  horaInicio: configCong.fimSemana.horaInicio || "19:00",
                  horaFim: configCong.fimSemana.horaFim || "20:45",
                  responsavel: 'Corpo de Anciãos',
                  telefone: '',
                  observacoes: 'Horário semanal fixo (Uso integral do Salão do Reino)',
                  isFixa: true
                });
              }
            });
          }
        });

        return lista;
      }, [currentDate, rotacoes, congregacoes]);

      // Unir reuniões fixas e reservas manuais
      const todosEventos = useMemo(() => {
        const combinados = [...reunioesFixasDoAno, ...reservasManuais];
        combinados.sort((a, b) => ((a.data || '') + (a.horaInicio || '')).localeCompare((b.data || '') + (b.horaInicio || '')));
        return combinados;
      }, [reunioesFixasDoAno, reservasManuais]);

      // =========================================================================
      // DETECTOR DE CONFLITOS EM TEMPO REAL COM BLOQUEIO INTEGRAL DO PRÉDIO
      // =========================================================================
      const conflitoDetectado = useMemo(() => {
        if (!modalAberto) return null;
        if (!formEvento.data || !formEvento.horaInicio || !formEvento.horaFim || !formEvento.espacoId) return null;

        const novoInicio = formEvento.horaInicio;
        const novoFim = formEvento.horaFim;

        // Procura eventos na mesma data
        const eventosNaMesmaData = todosEventos.filter(ev => {
          if (eventoEmEdicao && ev.id === eventoEmEdicao) return false;
          return ev.data === formEvento.data;
        });

        for (const ev of eventosNaMesmaData) {
          const evInicio = ev.horaInicio;
          const evFim = ev.horaFim;

          // Checa sobreposição no tempo
          const temSobreposicaoHorario = novoInicio < evFim && novoFim > evInicio;

          if (temSobreposicaoHorario) {
            // Regra 1: Se o evento existente for Reunião Semanal (bloqueia todo o prédio),
            // nenhum espaço (nem Salão Principal, nem Sala B) pode ser agendado!
            // Regra 2: Se for outro evento manual, conflita se for no mesmo espaço.
            const conflitaEspaco = ev.bloqueiaTodoPredio || ev.espacoId === formEvento.espacoId;

            if (conflitaEspaco) {
              const cong = congregacoes.find(c => c.id === ev.congregacaoId);
              const espaco = ESPACOS_SALAO.find(e => e.id === ev.espacoId);
              return {
                eventoConflitante: ev,
                nomeCongregacao: cong?.nome || 'Outra congregação',
                espacoNome: ev.bloqueiaTodoPredio ? 'Todo o Salão do Reino (Salão Principal + Sala B)' : (espaco?.label || 'Salão'),
                horario: `${evInicio} às ${evFim}`,
                isFixa: ev.isFixa,
                bloqueiaTodoPredio: ev.bloqueiaTodoPredio
              };
            }
          }
        }

        return null;
      }, [modalAberto, formEvento, todosEventos, eventoEmEdicao, congregacoes]);

      // Filtros
      const eventosFiltrados = useMemo(() => {
        return todosEventos.filter(ev => {
          const matchCong = congAtiva === 'todas' || ev.congregacaoId === congAtiva;
          const matchEspaco = filtroEspaco === 'todos' || ev.espacoId === filtroEspaco;
          return matchCong && matchEspaco;
        });
      }, [todosEventos, congAtiva, filtroEspaco]);

      // 1. Visão Mês
      const diasDoMes = useMemo(() => {
        const ano = currentDate.getFullYear();
        const mes = currentDate.getMonth();
        const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
        const totalDias = new Date(ano, mes + 1, 0).getDate();

        const dias = [];
        for (let i = 0; i < primeiroDiaSemana; i++) dias.push(null);
        for (let d = 1; d <= totalDias; d++) {
          const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          dias.push({
            diaNumero: d,
            dataStr,
            eventos: eventosFiltrados.filter(e => e.data === dataStr)
          });
        }
        return dias;
      }, [currentDate, eventosFiltrados]);

      // 2. Visão Semana
      const diasDaSemana = useMemo(() => {
        const d = new Date(currentDate);
        const diaSemanaAtual = d.getDay();
        const inicioSemana = new Date(d);
        inicioSemana.setDate(d.getDate() - diaSemanaAtual);

        const dias = [];
        for (let i = 0; i < 7; i++) {
          const dataDia = new Date(inicioSemana);
          dataDia.setDate(inicioSemana.getDate() + i);
          const ano = dataDia.getFullYear();
          const mes = dataDia.getMonth() + 1;
          const diaNum = dataDia.getDate();
          const dataStr = `${ano}-${String(mes).padStart(2, '0')}-${String(diaNum).padStart(2, '0')}`;

          dias.push({
            nomeDia: DIAS_OPCOES[i].nome.split('-')[0],
            diaNumero: diaNum,
            dataStr,
            eventos: eventosFiltrados.filter(e => e.data === dataStr)
          });
        }
        return dias;
      }, [currentDate, eventosFiltrados]);

      // 3. Visão Dia
      const eventosDoDiaAtual = useMemo(() => {
        const ano = currentDate.getFullYear();
        const mes = currentDate.getMonth() + 1;
        const diaNum = currentDate.getDate();
        const dataStr = `${ano}-${String(mes).padStart(2, '0')}-${String(diaNum).padStart(2, '0')}`;
        return {
          dataStr,
          eventos: eventosFiltrados.filter(e => e.data === dataStr)
        };
      }, [currentDate, eventosFiltrados]);

      // Navegação
      const handlePrev = () => {
        const d = new Date(currentDate);
        if (viewMode === 'mes') d.setMonth(d.getMonth() - 1);
        else if (viewMode === 'semana') d.setDate(d.getDate() - 7);
        else d.setDate(d.getDate() - 1);
        setCurrentDate(d);
      };

      const handleNext = () => {
        const d = new Date(currentDate);
        if (viewMode === 'mes') d.setMonth(d.getMonth() + 1);
        else if (viewMode === 'semana') d.setDate(d.getDate() + 7);
        else d.setDate(d.getDate() + 1);
        setCurrentDate(d);
      };

      const handleHoje = () => setCurrentDate(new Date());

      const tituloPeriodo = useMemo(() => {
        if (viewMode === 'mes') {
          return currentDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        }
        if (viewMode === 'semana') {
          const primeiro = diasDaSemana[0]?.diaNumero;
          const ultimo = diasDaSemana[6]?.diaNumero;
          const mes = currentDate.toLocaleDateString('pt-BR', { month: 'short' });
          const ano = currentDate.getFullYear();
          return `Semana: ${primeiro} a ${ultimo} de ${mes}, ${ano}`;
        }
        return currentDate.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }, [viewMode, currentDate, diasDaSemana]);

      // Abrir Modal para CRIAR novo
      const abrirNovoAgendamento = (dataPredefinida = null) => {
        setEventoEmEdicao(null);
        setFormEvento({
          ...EVENTO_INICIAL,
          data: dataPredefinida || new Date().toISOString().split('T')[0]
        });
        setModalAberto(true);
      };

      // Abrir Modal para EDITAR existente
      const abrirEditarEvento = (ev) => {
        if (ev.isFixa) {
          alert("Esta é uma reunião semanal fixa. Para alterar o dia ou horário, utilize o botão 'Configurações' no topo da página.");
          return;
        }
        setEventoEmEdicao(ev.id);
        setFormEvento({
          titulo: ev.titulo || '',
          congregacaoId: ev.congregacaoId || 'espanhola',
          espacoId: ev.espacoId || 'salao_principal',
          tipoEvento: ev.tipoEvento || 'outro',
          data: ev.data || new Date().toISOString().split('T')[0],
          horaInicio: ev.horaInicio || '19:00',
          horaFim: ev.horaFim || '21:00',
          responsavel: ev.responsavel || '',
          telefone: ev.telefone || '',
          observacoes: ev.observacoes || ''
        });
        setEventoSelecionado(null);
        setModalAberto(true);
      };

      // Salvar com bloqueio anti-conflito
      const handleSalvarReserva = async (e) => {
        e.preventDefault();

        if (conflitoDetectado) {
          if (conflitoDetectado.bloqueiaTodoPredio) {
            alert(`Choque de Reunião!\nDurante as reuniões semanais das congregações, todo o Salão do Reino é utilizado (inclusive a Sala B).\n\nConflito com: ${conflitoDetectado.eventoConflitante.titulo} (${conflitoDetectado.horario}).\nPor favor, agende em outro dia ou horário.`);
          } else {
            alert(`Choque de Horário Detectado!\nJá existe o evento "${conflitoDetectado.eventoConflitante.titulo}" agendado das ${conflitoDetectado.horario} no ${conflitoDetectado.espacoNome}.\n\nPor favor, escolha outro horário ou o outro ambiente.`);
          }
          return;
        }

        if (formEvento.horaFim <= formEvento.horaInicio) {
          alert("O horário de término precisa ser posterior ao horário de início.");
          return;
        }

        if (!window.db || !window.firestoreOps) {
          alert("Aguardando conexão com o banco...");
          return;
        }

        const { collection, doc, setDoc } = window.firestoreOps;
        const id = eventoEmEdicao || ('res_' + Date.now());
        
        await setDoc(doc(collection(window.db, 'reservas_salao'), id), formEvento, { merge: true });
        
        setModalAberto(false);
        setEventoEmEdicao(null);
        setFormEvento(EVENTO_INICIAL);
      };

      // Excluir
      const handleExcluir = async (id, isFixa) => {
        if (isFixa) {
          alert("Esta é uma reunião fixa semanal. Para alterar o dia ou horário, utilize o botão 'Configurações'.");
          return;
        }
        if (!confirm('Deseja excluir este agendamento?')) return;
        if (!window.db || !window.firestoreOps) return;
        const { doc, deleteDoc } = window.firestoreOps;
        await deleteDoc(doc(window.db, 'reservas_salao', id));
        setEventoSelecionado(null);
      };

      // Salvar Configurações
      const handleSalvarConfig = async () => {
        if (!window.db || !window.firestoreOps) return;
        const { doc, setDoc } = window.firestoreOps;
        await setDoc(doc(window.db, 'configuracoes', 'geral'), {
          rotacoes,
          congregacoes
        }, { merge: true });
        setModalConfigAberto(false);
      };

      // Restaurar Padrão
      const handleRestaurarPadrao = async () => {
        if (!confirm('Deseja restaurar as configurações de rodízio para o padrão oficial das 3 congregações?')) return;
        if (!window.db || !window.firestoreOps) return;
        const { doc, setDoc } = window.firestoreOps;
        await setDoc(doc(window.db, 'configuracoes', 'geral'), {
          rotacoes: CONFIG_RODIZIO_DEFAULT,
          congregacoes: CONGREGACOES_DEFAULT
        });
        setRotacoes(CONFIG_RODIZIO_DEFAULT);
        setCongregacoes(CONGREGACOES_DEFAULT);
        alert('Configurações restauradas com sucesso!');
      };

      return (
        <div className="min-h-screen pb-12">
          {/* HEADER PRINCIPAL */}
          <header className="bg-slate-900 text-white sticky top-0 z-20 shadow-md">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-lg shadow">
                  SR
                </div>
                <div>
                  <h1 className="font-bold text-base md:text-lg leading-tight">Salão do Reino</h1>
                  <p className="text-xs text-slate-400">Espanhola • Itinga • Profipo</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setModalConfigAberto(true)}
                  className="px-3 py-2 text-xs md:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition"
                >
                  ⚙️ Configurações
                </button>
                <button
                  onClick={() => abrirNovoAgendamento()}
                  className="px-3.5 py-2 text-xs md:text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow transition"
                >
                  ➕ Agendar
                </button>
              </div>
            </div>

            {/* BARRA DE FILTROS E MODO DE VISUALIZAÇÃO */}
            <div className="bg-slate-800 border-t border-slate-700 px-4 py-2.5">
              <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
                
                {/* BOTÕES DAS CONGREGAÇÕES COM IDENTIFICAÇÃO DE CORES */}
                <div className="flex items-center gap-2 overflow-x-auto py-1">
                  <button
                    onClick={() => setCongAtiva('todas')}
                    className={`px-3 py-1.5 text-xs rounded-full font-bold transition flex items-center gap-1.5 ${
                      congAtiva === 'todas'
                        ? 'bg-white text-slate-900 shadow-md ring-2 ring-white'
                        : 'bg-slate-700/80 text-slate-300 hover:bg-slate-700'
                    }`}
                  >
                    <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                    Todas
                  </button>

                  {congregacoes.map(c => {
                    const estaAtivo = congAtiva === c.id;
                    return (
                      <button
                        key={c.id}
                        onClick={() => setCongAtiva(c.id)}
                        style={{
                          backgroundColor: estaAtivo ? c.hex : `${c.hex}22`,
                          borderColor: c.hex,
                          color: estaAtivo ? '#ffffff' : '#f8fafc'
                        }}
                        className={`px-3 py-1.5 text-xs rounded-full font-bold border transition flex items-center gap-1.5 shadow-sm ${
                          estaAtivo ? 'ring-2 ring-white scale-105' : 'hover:brightness-125'
                        }`}
                      >
                        <span
                          className="w-2.5 h-2.5 rounded-full border border-white/60"
                          style={{ backgroundColor: c.hex }}
                        ></span>
                        {c.nome}
                      </button>
                    );
                  })}
                </div>

                {/* Filtro Espaço & SELETOR: MÊS / SEMANA / DIA */}
                <div className="flex items-center gap-2">
                  <select
                    value={filtroEspaco}
                    onChange={(e) => setFiltroEspaco(e.target.value)}
                    className="bg-slate-700 text-xs text-white rounded-lg px-2.5 py-1.5 border border-slate-600 focus:outline-none"
                  >
                    <option value="todos">Todos os Espaços</option>
                    <option value="salao_principal">Salão Principal</option>
                    <option value="sala_b">Sala B</option>
                  </select>

                  <div className="bg-slate-900 p-0.5 rounded-lg flex border border-slate-700 text-xs">
                    <button
                      onClick={() => setViewMode('mes')}
                      className={`px-3 py-1 rounded-md font-semibold transition ${viewMode === 'mes' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                    >
                      Mês
                    </button>
                    <button
                      onClick={() => setViewMode('semana')}
                      className={`px-3 py-1 rounded-md font-semibold transition ${viewMode === 'semana' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                    >
                      Semana
                    </button>
                    <button
                      onClick={() => setViewMode('dia')}
                      className={`px-3 py-1 rounded-md font-semibold transition ${viewMode === 'dia' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                    >
                      Dia
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* STATUS */}
          <div className="max-w-6xl mx-auto px-4 mt-2 flex justify-between items-center text-[11px] text-slate-500">
            <span className="flex items-center gap-1.5">
              <span className={`w-2 h-2 rounded-full ${statusConexao === 'Tempo real ativo' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
              {statusConexao}
            </span>
            <span className="flex items-center gap-1 text-emerald-600 font-semibold">
              <span>🛡️</span> As reuniões semanais bloqueiam todo o Salão (Principal + Sala B)
            </span>
          </div>

          <main className="max-w-6xl mx-auto px-4 mt-3">
            {/* NAVEGAÇÃO DE PERÍODO */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 mb-4 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <button
                  onClick={handlePrev}
                  className="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm"
                  title="Anterior"
                >
                  ◀
                </button>
                <button
                  onClick={handleHoje}
                  className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs"
                >
                  Hoje
                </button>
                <button
                  onClick={handleNext}
                  className="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm"
                  title="Próximo"
                >
                  ▶
                </button>
              </div>

              <h2 className="font-bold text-slate-800 text-base md:text-lg capitalize text-center px-2">
                {tituloPeriodo}
              </h2>

              <button
                onClick={() => abrirNovoAgendamento()}
                className="hidden sm:inline-flex text-xs font-semibold text-blue-600 hover:text-blue-700 hover:underline"
              >
                + Agendar evento
              </button>
            </div>

            {/* ===================== VISÃO 1: MÊS ===================== */}
            {viewMode === 'mes' && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center font-bold text-xs text-slate-600 py-2.5">
                  <span className="text-red-600">Dom</span>
                  <span>Seg</span>
                  <span>Ter</span>
                  <span>Qua</span>
                  <span>Qui</span>
                  <span>Sex</span>
                  <span className="text-blue-600">Sáb</span>
                </div>

                <div className="grid grid-cols-7 auto-rows-fr">
                  {diasDoMes.map((dia, idx) => {
                    if (!dia) {
                      return <div key={`empty-${idx}`} className="min-h-[95px] md:min-h-[120px] bg-slate-50/50 border-b border-r border-slate-100"></div>;
                    }

                    const ehHoje = new Date().toISOString().split('T')[0] === dia.dataStr;

                    return (
                      <div
                        key={dia.dataStr}
                        onClick={() => {
                          if (dia.eventos.length === 0) {
                            abrirNovoAgendamento(dia.dataStr);
                          }
                        }}
                        className={`min-h-[95px] md:min-h-[120px] p-1.5 md:p-2 border-b border-r border-slate-100 flex flex-col justify-between cursor-pointer transition hover:bg-blue-50/30 ${ehHoje ? 'bg-blue-50/30' : 'bg-white'}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${ehHoje ? 'bg-blue-600 text-white' : 'text-slate-700'}`}>
                            {dia.diaNumero}
                          </span>
                        </div>

                        <div className="space-y-1 mt-1 overflow-y-auto max-h-[85px]">
                          {dia.eventos.map(ev => {
                            const cong = congregacoes.find(c => c.id === ev.congregacaoId);
                            return (
                              <div
                                key={ev.id}
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setEventoSelecionado(ev);
                                }}
                                className="text-[10px] md:text-[11px] leading-tight px-1.5 py-1 rounded font-medium text-white shadow-xs truncate flex items-center gap-1 cursor-pointer hover:opacity-90"
                                style={{ backgroundColor: cong?.hex || '#2563eb' }}
                              >
                                <span className="font-bold text-[9px] opacity-90">{ev.horaInicio}</span>
                                <span className="truncate">{ev.titulo}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ===================== VISÃO 2: SEMANA ===================== */}
            {viewMode === 'semana' && (
              <div className="grid grid-cols-1 md:grid-cols-7 gap-3">
                {diasDaSemana.map((dia, idx) => {
                  const ehHoje = new Date().toISOString().split('T')[0] === dia.dataStr;

                  return (
                    <div
                      key={dia.dataStr}
                      className={`bg-white rounded-2xl border shadow-sm p-3 flex flex-col justify-between min-h-[340px] ${ehHoje ? 'border-blue-400 ring-2 ring-blue-100' : 'border-slate-200'}`}
                    >
                      <div>
                        <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-100">
                          <div>
                            <span className={`text-xs font-bold ${idx === 0 ? 'text-red-600' : idx === 6 ? 'text-blue-600' : 'text-slate-500'}`}>
                              {dia.nomeDia}
                            </span>
                            <div className="text-xl font-bold text-slate-800 leading-none mt-0.5">
                              {dia.diaNumero}
                            </div>
                          </div>
                          {ehHoje && (
                            <span className="text-[10px] font-bold bg-blue-600 text-white px-2 py-0.5 rounded-full">
                              Hoje
                            </span>
                          )}
                        </div>

                        <div className="space-y-2 mt-2">
                          {dia.eventos.length === 0 ? (
                            <p className="text-[11px] text-slate-400 italic py-4 text-center">Nenhum evento</p>
                          ) : (
                            dia.eventos.map(ev => {
                              const cong = congregacoes.find(c => c.id === ev.congregacaoId);
                              const espaco = ESPACOS_SALAO.find(e => e.id === ev.espacoId);

                              return (
                                <div
                                  key={ev.id}
                                  onClick={() => setEventoSelecionado(ev)}
                                  className="p-2 rounded-xl text-white text-xs cursor-pointer shadow-sm hover:opacity-95 transition"
                                  style={{ backgroundColor: cong?.hex || '#2563eb' }}
                                >
                                  <div className="flex justify-between items-center text-[10px] opacity-90 mb-1">
                                    <span className="font-bold">⏰ {ev.horaInicio} às {ev.horaFim}</span>
                                    <span className="bg-white/20 px-1.5 py-0.5 rounded font-semibold text-[9px]">
                                      {ev.bloqueiaTodoPredio ? 'Todo o Salão' : (espaco?.label === 'Salão Principal' ? 'Principal' : 'Sala B')}
                                    </span>
                                  </div>
                                  <p className="font-bold leading-tight">{ev.titulo}</p>
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>

                      <button
                        onClick={() => abrirNovoAgendamento(dia.dataStr)}
                        className="mt-3 text-center text-xs font-bold text-blue-600 hover:text-blue-700 py-1.5 border border-dashed border-blue-200 rounded-lg hover:bg-blue-50 transition"
                      >
                        + Reservar
                      </button>
                    </div>
                  );
                })}
              </div>
            )}

            {/* ===================== VISÃO 3: DIA ===================== */}
            {viewMode === 'dia' && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6">
                <div className="flex flex-wrap items-center justify-between pb-4 mb-4 border-b border-slate-100 gap-2">
                  <div>
                    <h3 className="text-lg font-bold text-slate-800">Programação do Dia</h3>
                    <p className="text-xs text-slate-500">
                      Uso dos ambientes: Salão Principal e Sala B
                    </p>
                  </div>
                  <button
                    onClick={() => abrirNovoAgendamento(eventosDoDiaAtual.dataStr)}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow transition"
                  >
                    + Agendar para esta data
                  </button>
                </div>

                {eventosDoDiaAtual.eventos.length === 0 ? (
                  <div className="text-center py-12">
                    <div className="text-4xl mb-2">🏖️</div>
                    <h4 className="font-bold text-slate-700">Nenhum evento agendado para este dia</h4>
                    <p className="text-xs text-slate-400 mt-1">O Salão Principal e a Sala B estão livres.</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {eventosDoDiaAtual.eventos.map(ev => {
                      const cong = congregacoes.find(c => c.id === ev.congregacaoId);
                      const espaco = ESPACOS_SALAO.find(e => e.id === ev.espacoId);

                      return (
                        <div
                          key={ev.id}
                          onClick={() => setEventoSelecionado(ev)}
                          className="p-4 rounded-xl border border-slate-200 hover:shadow-md transition cursor-pointer flex flex-col md:flex-row md:items-center justify-between gap-3 bg-slate-50"
                        >
                          <div className="flex items-start gap-3">
                            <div
                              className="w-3 self-stretch rounded-full"
                              style={{ backgroundColor: cong?.hex || '#2563eb' }}
                            ></div>
                            <div>
                              <div className="flex items-center gap-2 mb-1">
                                <span
                                  className="text-xs font-bold px-2 py-0.5 rounded text-white"
                                  style={{ backgroundColor: cong?.hex || '#2563eb' }}
                                >
                                  {cong?.nome}
                                </span>
                                <span className="text-xs font-semibold text-slate-700 bg-white border border-slate-200 px-2 py-0.5 rounded">
                                  {ev.bloqueiaTodoPredio ? 'Todo o Prédio' : espaco?.label}
                                </span>
                                {ev.isFixa && (
                                  <span className="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">
                                    Reunião Fixa
                                  </span>
                                )}
                              </div>
                              <h4 className="font-bold text-slate-800 text-base">{ev.titulo}</h4>
                              <p className="text-xs text-slate-500 mt-0.5">
                                {TIPOS_EVENTO.find(t => t.id === ev.tipoEvento)?.label || ev.tipoEvento}
                              </p>
                              {ev.responsavel && !ev.isFixa && (
                                <p className="text-xs text-slate-600 mt-1">
                                  Resp: <strong>{ev.responsavel}</strong> {ev.telefone && `(${ev.telefone})`}
                                </p>
                              )}
                            </div>
                          </div>

                          <div className="text-right">
                            <div className="text-sm font-bold text-slate-800">
                              ⏰ {ev.horaInicio} às {ev.horaFim}
                            </div>
                            <span className="text-xs text-blue-600 font-semibold underline mt-1 inline-block">
                              Ver Detalhes / Editar
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL DETALHES */}
          {eventoSelecionado && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <span
                      className="text-xs font-bold px-2.5 py-0.5 rounded-full text-white inline-block mb-1"
                      style={{ backgroundColor: congregacoes.find(c => c.id === eventoSelecionado.congregacaoId)?.hex || '#2563eb' }}
                    >
                      {congregacoes.find(c => c.id === eventoSelecionado.congregacaoId)?.nome}
                    </span>
                    <h3 className="font-bold text-lg text-slate-800 leading-tight">{eventoSelecionado.titulo}</h3>
                  </div>
                  <button onClick={() => setEventoSelecionado(null)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>

                <div className="space-y-2 text-xs text-slate-600 bg-slate-50 p-3.5 rounded-xl border border-slate-200 mb-4">
                  <div><strong>Local:</strong> {eventoSelecionado.bloqueiaTodoPredio ? 'Todo o Salão do Reino (Salão Principal + Sala B)' : ESPACOS_SALAO.find(e => e.id === eventoSelecionado.espacoId)?.label}</div>
                  <div><strong>Data:</strong> {eventoSelecionado.data.split('-').reverse().join('/')}</div>
                  <div><strong>Horário:</strong> {eventoSelecionado.horaInicio} às {eventoSelecionado.horaFim}</div>
                  {eventoSelecionado.isFixa ? (
                    <div className="text-blue-700 font-semibold bg-blue-50 p-2 rounded border border-blue-100">
                      ℹ️ Reunião semanal fixa do rodízio. O Salão do Reino inteiro fica ocupado durante este período.
                    </div>
                  ) : (
                    <>
                      {eventoSelecionado.responsavel && <div><strong>Responsável:</strong> {eventoSelecionado.responsavel} {eventoSelecionado.telefone && `(${eventoSelecionado.telefone})`}</div>}
                      {eventoSelecionado.observacoes && <div><strong>Obs:</strong> {eventoSelecionado.observacoes}</div>}
                    </>
                  )}
                </div>

                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                  {!eventoSelecionado.isFixa ? (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => abrirEditarEvento(eventoSelecionado)}
                        className="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-lg text-xs border border-blue-200 flex items-center gap-1 transition"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        onClick={() => handleExcluir(eventoSelecionado.id, false)}
                        className="px-3 py-1.5 text-xs text-red-600 font-bold hover:bg-red-50 rounded-lg transition"
                      >
                        Excluir
                      </button>
                    </div>
                  ) : <div></div>}
                  <button
                    onClick={() => setEventoSelecionado(null)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL: NOVO AGENDAMENTO OU EDIÇÃO COM ALERTA DE CHOQUE ATIVO */}
          {/* ============================================================== */}
          {modalAberto && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="font-bold text-lg text-slate-800">
                    {eventoEmEdicao ? '✏️ Editar Agendamento' : '➕ Novo Agendamento'}
                  </h3>
                  <button onClick={() => setModalAberto(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
                </div>

                <form onSubmit={handleSalvarReserva} className="space-y-4">
                  {/* CARD DE ALERTA DE CONFLITO / CHOQUE DE HORÁRIO */}
                  {conflitoDetectado && (
                    <div className="p-3.5 bg-red-50 border-2 border-red-400 rounded-xl flex items-start gap-3 animate-pulse">
                      <span className="text-2xl leading-none">⚠️</span>
                      <div className="text-xs text-red-800">
                        <p className="font-bold text-sm text-red-900 mb-0.5">
                          {conflitoDetectado.bloqueiaTodoPredio ? 'Conflito: Salão do Reino Inteiro em Uso!' : 'Atenção: Horário Indisponível!'}
                        </p>
                        <p>
                          {conflitoDetectado.bloqueiaTodoPredio 
                            ? 'Durante a reunião semanal, todo o Salão do Reino é utilizado (inclusive a Sala B):'
                            : 'Já existe um evento marcado para este mesmo local e período:'}
                        </p>
                        <div className="mt-2 bg-white/80 p-2 rounded border border-red-200 font-semibold space-y-0.5">
                          <p>📌 <strong>Evento:</strong> {conflitoDetectado.eventoConflitante.titulo}</p>
                          <p>🏛️ <strong>Espaço Ocupado:</strong> {conflitoDetectado.espacoNome}</p>
                          <p>⏰ <strong>Horário em choque:</strong> {conflitoDetectado.horario}</p>
                          <p>👥 <strong>Congregação:</strong> {conflitoDetectado.nomeCongregacao}</p>
                        </div>
                        <p className="mt-1.5 text-[11px] text-red-700 italic">
                          {conflitoDetectado.bloqueiaTodoPredio 
                            ? 'Não é permitido agendar nenhum ambiente durante as reuniões semanais.'
                            : `Escolha outro horário ou alterne para a ${formEvento.espacoId === 'salao_principal' ? 'Sala B' : 'Salão Principal'}.`}
                        </p>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Título do Evento *</label>
                    <input
                      required
                      type="text"
                      placeholder="Ex: Discurso de Casamento, Limpeza Geral..."
                      value={formEvento.titulo}
                      onChange={e => setFormEvento({ ...formEvento, titulo: e.target.value })}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Congregação *</label>
                      <select
                        value={formEvento.congregacaoId}
                        onChange={e => setFormEvento({ ...formEvento, congregacaoId: e.target.value })}
                        className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none"
                      >
                        {congregacoes.map(c => (
                          <option key={c.id} value={c.id}>{c.nome}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Espaço *</label>
                      <select
                        value={formEvento.espacoId}
                        onChange={e => setFormEvento({ ...formEvento, espacoId: e.target.value })}
                        className={`w-full text-sm border rounded-lg p-2.5 focus:outline-none ${conflitoDetectado ? 'border-red-400 bg-red-50 text-red-900 font-bold' : 'border-slate-300'}`}
                      >
                        {ESPACOS_SALAO.map(e => (
                          <option key={e.id} value={e.id}>{e.label}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Data *</label>
                      <input
                        required
                        type="date"
                        value={formEvento.data}
                        onChange={e => setFormEvento({ ...formEvento, data: e.target.value })}
                        className={`w-full text-sm border rounded-lg p-2 focus:outline-none ${conflitoDetectado ? 'border-red-400 bg-red-50' : 'border-slate-300'}`}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Início *</label>
                      <input
                        required
                        type="time"
                        value={formEvento.horaInicio}
                        onChange={e => setFormEvento({ ...formEvento, horaInicio: e.target.value })}
                        className={`w-full text-sm border rounded-lg p-2 focus:outline-none ${conflitoDetectado ? 'border-red-400 bg-red-50 font-bold text-red-800' : 'border-slate-300'}`}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Término *</label>
                      <input
                        required
                        type="time"
                        value={formEvento.horaFim}
                        onChange={e => setFormEvento({ ...formEvento, horaFim: e.target.value })}
                        className={`w-full text-sm border rounded-lg p-2 focus:outline-none ${conflitoDetectado ? 'border-red-400 bg-red-50 font-bold text-red-800' : 'border-slate-300'}`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Responsável</label>
                      <input
                        type="text"
                        placeholder="Nome do irmão"
                        value={formEvento.responsavel}
                        onChange={e => setFormEvento({ ...formEvento, responsavel: e.target.value })}
                        className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Telefone / WhatsApp</label>
                      <input
                        type="text"
                        placeholder="(47) 99999-9999"
                        value={formEvento.telefone}
                        onChange={e => setFormEvento({ ...formEvento, telefone: e.target.value })}
                        className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Observações</label>
                    <textarea
                      rows="2"
                      placeholder="Detalhes adicionais..."
                      value={formEvento.observacoes}
                      onChange={e => setFormEvento({ ...formEvento, observacoes: e.target.value })}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:outline-none"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setModalAberto(false)}
                      className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={!!conflitoDetectado}
                      className={`px-5 py-2 text-sm font-bold rounded-lg shadow transition ${
                        conflitoDetectado
                          ? 'bg-slate-300 text-slate-500 cursor-not-allowed'
                          : 'bg-blue-600 hover:bg-blue-500 text-white'
                      }`}
                    >
                      {conflitoDetectado ? 'Horário Ocupado' : (eventoEmEdicao ? 'Salvar Alterações' : 'Salvar Agendamento')}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL CONFIGURAÇÕES & RODÍZIO INFINITO */}
          {modalConfigAberto && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-xl rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="font-bold text-lg text-slate-800">Configurações Gerais & Rodízio</h3>
                  <button onClick={() => setModalConfigAberto(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
                </div>

                <div className="space-y-6">
                  {/* Rodízio Anual */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="flex items-center justify-between mb-3">
                      <h4 className="font-bold text-sm text-slate-800">Escala de Reuniões</h4>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setAnoEdicao(prev => prev - 1)}
                          className="px-2 py-1 text-xs bg-white border border-slate-300 rounded hover:bg-slate-100 font-bold"
                        >◀</button>
                        <span className="font-bold text-slate-800 text-sm px-1">Ano {anoEdicao}</span>
                        <button
                          onClick={() => setAnoEdicao(prev => prev + 1)}
                          className="px-2 py-1 text-xs bg-white border border-slate-300 rounded hover:bg-slate-100 font-bold"
                        >▶</button>
                      </div>
                    </div>

                    <p className="text-xs text-slate-500 mb-3">
                      Defina os dias e horários das reuniões das congregações para o ano de <strong>{anoEdicao}</strong>:
                    </p>

                    {congregacoes.map(cong => {
                      const escalaAno = rotacoes[String(anoEdicao)]?.[cong.id] || rotacoes["2026"]?.[cong.id] || CONFIG_RODIZIO_DEFAULT["2026"][cong.id];

                      return (
                        <div key={cong.id} className="bg-white p-3 rounded-lg border border-slate-200 mb-3">
                          <span className="text-xs font-bold px-2 py-0.5 rounded text-white inline-block mb-2" style={{ backgroundColor: cong.hex }}>
                            {cong.nome}
                          </span>
                          
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                            {/* Meio de Semana */}
                            <div className="bg-slate-50 p-2 rounded border border-slate-200">
                              <span className="font-bold text-slate-700 block mb-1">Meio de Semana:</span>
                              <div className="space-y-1">
                                <select
                                  value={escalaAno?.meioSemana?.diaSemana ?? 2}
                                  onChange={(e) => {
                                    const novo = { ...rotacoes };
                                    const anoStr = String(anoEdicao);
                                    if (!novo[anoStr]) novo[anoStr] = JSON.parse(JSON.stringify(rotacoes["2026"] || CONFIG_RODIZIO_DEFAULT["2026"]));
                                    novo[anoStr][cong.id].meioSemana.diaSemana = Number(e.target.value);
                                    novo[anoStr][cong.id].meioSemana.diaNome = DIAS_OPCOES.find(d => d.valor === Number(e.target.value))?.nome || '';
                                    setRotacoes(novo);
                                  }}
                                  className="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"
                                >
                                  {DIAS_OPCOES.map(d => (
                                    <option key={d.valor} value={d.valor}>{d.nome}</option>
                                  ))}
                                </select>
                                <div className="flex items-center gap-1">
                                  <span>Início:</span>
                                  <input
                                    type="time"
                                    value={escalaAno?.meioSemana?.horaInicio || "19:30"}
                                    onChange={(e) => {
                                      const novo = { ...rotacoes };
                                      const anoStr = String(anoEdicao);
                                      if (!novo[anoStr]) novo[anoStr] = JSON.parse(JSON.stringify(rotacoes["2026"] || CONFIG_RODIZIO_DEFAULT["2026"]));
                                      novo[anoStr][cong.id].meioSemana.horaInicio = e.target.value;
                                      setRotacoes(novo);
                                    }}
                                    className="border border-slate-300 rounded px-1 py-0.5 text-xs w-full bg-white"
                                  />
                                </div>
                              </div>
                            </div>

                            {/* Fim de Semana */}
                            <div className="bg-slate-50 p-2 rounded border border-slate-200">
                              <span className="font-bold text-slate-700 block mb-1">Fim de Semana:</span>
                              <div className="space-y-1">
                                <select
                                  value={escalaAno?.fimSemana?.diaSemana ?? 0}
                                  onChange={(e) => {
                                    const novo = { ...rotacoes };
                                    const anoStr = String(anoEdicao);
                                    if (!novo[anoStr]) novo[anoStr] = JSON.parse(JSON.stringify(rotacoes["2026"] || CONFIG_RODIZIO_DEFAULT["2026"]));
                                    novo[anoStr][cong.id].fimSemana.diaSemana = Number(e.target.value);
                                    novo[anoStr][cong.id].fimSemana.diaNome = DIAS_OPCOES.find(d => d.valor === Number(e.target.value))?.nome || '';
                                    setRotacoes(novo);
                                  }}
                                  className="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"
                                >
                                  {DIAS_OPCOES.map(d => (
                                    <option key={d.valor} value={d.valor}>{d.nome}</option>
                                  ))}
                                </select>
                                <div className="flex items-center gap-1">
                                  <span>Início:</span>
                                  <input
                                    type="time"
                                    value={escalaAno?.fimSemana?.horaInicio || "09:00"}
                                    onChange={(e) => {
                                      const novo = { ...rotacoes };
                                      const anoStr = String(anoEdicao);
                                      if (!novo[anoStr]) novo[anoStr] = JSON.parse(JSON.stringify(rotacoes["2026"] || CONFIG_RODIZIO_DEFAULT["2026"]));
                                      novo[anoStr][cong.id].fimSemana.horaInicio = e.target.value;
                                      setRotacoes(novo);
                                    }}
                                    className="border border-slate-300 rounded px-1 py-0.5 text-xs w-full bg-white"
                                  />
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Restauração */}
                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-800 flex justify-between items-center">
                    <div>
                      <p className="font-bold">Restaurar escala padrão</p>
                      <p className="text-[11px] text-amber-700">Aplica a escala 2026 oficial das 3 congregações.</p>
                    </div>
                    <button
                      type="button"
                      onClick={handleRestaurarPadrao}
                      className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg shadow-sm whitespace-nowrap ml-2"
                    >
                      Restaurar Padrão
                    </button>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button
                      type="button"
                      onClick={() => setModalConfigAberto(false)}
                      className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg"
                    >
                      Fechar
                    </button>
                    <button
                      type="button"
                      onClick={handleSalvarConfig}
                      className="px-5 py-2 text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow"
                    >
                      Salvar Alterações
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
